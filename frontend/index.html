<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Activity</title>
    <link rel="stylesheet" href="style.css"> <!-- Linking the CSS file -->
</head>
<body>
    <h1>Workout Activity</h1>

    <form id="workout-form">
        <input type="text" id="title" placeholder="Workout Title" required>
        <input type="number" id="load" placeholder="Weight (kg)" required>
        <input type="number" id="reps" placeholder="Reps" required>
        <button type="submit">Add Workout</button>
    </form>

    <ul id="workout-list"></ul>

    <script src="app.js"></script> <!-- Linking the JS file -->
</body>
</html>
